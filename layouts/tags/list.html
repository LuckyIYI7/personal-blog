{{ define "main" }}
<div id="single-post">
  <article class="taxonomy-page">
    <h2>标签：{{ .Title }}</h2>
    <ul class="taxonomy-post-list">
      {{ range .Pages.ByDate.Reverse }}
        <li>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
          <small>{{ .Date.Format "2006-01-02" }}</small>
        </li>
      {{ else }}
        <li>该标签下暂无文章。</li>
      {{ end }}
    </ul>
    <p class="taxonomy-back"><a href="{{ "/tags/" | relLangURL }}">返回全部标签</a></p>
  </article>
</div>
{{ end }}
