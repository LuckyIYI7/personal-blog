theme = "neopost"
baseURL = "https://example.com/"
locale = "zh-cn"
title = "Jiayi's Hugo Blog"
enableRobotsTXT = true

[menus]
  [[menus.main]]
    name = "棣栭〉"
    pageRef = "/"
    weight = 1

  [[menus.main]]
    name = "鏂囩珷"
    pageRef = "/posts"
    weight = 2

  [[menus.main]]
    name = "褰掓。"
    pageRef = "/archives"
    weight = 3

  [[menus.main]]
    name = "鏍囩"
    pageRef = "/tags"
    weight = 4

  [[menus.main]]
    name = "鍒嗙被"
    pageRef = "/categories"
    weight = 5

  [[menus.main]]
    name = "RSS"
    url = "/index.xml"
    weight = 99

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[pagination]
  pagerSize = 10

[params]
  description = "My Hugo learning and engineering notes."
  theme = "light-blue"
  favicon = "/favicon.svg"
  posts-per-page = 10

[params.sidebar.tags]
  enable = false
  limit = 8
  more-text = "鏇村鏍囩..."

[params.read-more]
  length-limit = 160

[params.read-more.text]
  more = "灞曞紑"
  less = "鏀惰捣"
