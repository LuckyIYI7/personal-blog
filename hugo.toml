theme = "neopost"
baseURL = "https://example.com/"
locale = "zh-cn"
title = "我的 Hugo 博客"
enableRobotsTXT = true

[menus]
  [[menus.main]]
    name = "首页"
    pageRef = "/"
    weight = 1

  [[menus.main]]
    name = "文章"
    pageRef = "/posts"
    weight = 2

  [[menus.main]]
    name = "归档"
    pageRef = "/archives"
    weight = 3

  [[menus.main]]
    name = "标签"
    pageRef = "/tags"
    weight = 4

  [[menus.main]]
    name = "分类"
    pageRef = "/categories"
    weight = 5

  [[menus.main]]
    name = "RSS"
    url = "/index.xml"
    weight = 99

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[pagination]
  pagerSize = 10

[params]
  description = "My Hugo learning and engineering notes."
  theme = "light-blue"
  favicon = "/favicon.svg"
  posts-per-page = 10

[params.sidebar.tags]
  enable = false
  limit = 8
  more-text = "更多标签..."

[params.read-more]
  length-limit = 160

[params.read-more.text]
  more = "展开"
  less = "收起"